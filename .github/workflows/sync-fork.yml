name: Sync fork

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main with upstream
        env:
          # Fine-grained PAT for this repository: Contents and Workflows write.
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/merge-upstream" -f branch=main
